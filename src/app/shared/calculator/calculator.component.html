<p>
  <input type="number" required minlength="3" [(ngModel)]="x" placeholder="x" />
</p>
<p>
  <input type="number" required minlength="3" [(ngModel)]="y" placeholder="y" />
</p>
<p>
  <button (click)="add()">+</button>
  <button (click)="subtract()">-</button>
  <button (click)="clear()">C</button>
</p>
<p>
  {{result}}
</p>
